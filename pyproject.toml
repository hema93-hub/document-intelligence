[project]
name = "document-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.16.0",
    "numpy>=2.5.5",
    "openai>=3.58.0",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
]

[project.scripts]
document-intelligence = "document_intelligence.main:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
